#
# PostHog 私有化部署 — 单 docker-compose 文件部署包
#
# 镜像版本锁定（不同来源 commit 不完全同步，详见 README "镜像版本"）:
#   posthog/posthog            :16db3d19d9b1025a227c9d6c8a947d7053a95637
#   posthog/posthog-node       @sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
#   ghcr.io/posthog/posthog/*  :sha-d8b12b0
# 部署: cp .env.example .env && vim .env && docker-compose up -d
#

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '50m'
        max-file: '3'

services:
    # ============================================================
    # 基础设施层 (PG / Redis / ClickHouse / Kafka / MinIO / Caddy)
    # ============================================================

    db:
        image: postgres:15.12-alpine
        restart: on-failure
        logging: *default-logging
        environment:
            POSTGRES_USER: posthog
            POSTGRES_DB: posthog
            POSTGRES_PASSWORD: posthog
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U posthog']
            interval: 5s
            timeout: 30s
            retries: 30
            start_period: 10s
        volumes:
            - ./config/postgres-init-scripts:/docker-entrypoint-initdb.d:ro
            - ./config/products:/products:ro
            - postgres-data:/var/lib/postgresql/data

    redis7:
        image: redis:7.2-alpine
        restart: on-failure
        logging: *default-logging
        command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 3s
            timeout: 10s
            retries: 10
        volumes:
            - redis7-data:/data

    clickhouse:
        image: clickhouse/clickhouse-server:24.8
        restart: on-failure
        logging: *default-logging
        environment:
            CLICKHOUSE_SKIP_USER_SETUP: 1
            KAFKA_HOSTS: 'kafka:9092'
        healthcheck:
            test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
            interval: 3s
            timeout: 10s
            retries: 10
        depends_on:
            - kafka
            - zookeeper
        volumes:
            - ./config/idl:/idl:ro
            - ./config/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
            - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
            - ./config/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml:ro
            - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
            - ./config/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml:ro
            - ./config/user_scripts:/var/lib/clickhouse/user_scripts:ro
            - clickhouse-data:/var/lib/clickhouse

    zookeeper:
        image: zookeeper:3.7.0
        restart: on-failure
        logging: *default-logging
        volumes:
            - zookeeper-data:/data
            - zookeeper-datalog:/datalog
            - zookeeper-logs:/logs

    kafka:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        restart: on-failure
        logging: *default-logging
        depends_on:
            - zookeeper
        command:
            - redpanda
            - start
            - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
            - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
            - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
            - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
            - --rpc-addr kafka:33145
            - --advertise-rpc-addr kafka:33145
            - --mode dev-container
            - --smp 2
            - --memory 3G
            - --reserve-memory 500M
            - --overprovisioned
            - --set redpanda.empty_seed_starts_cluster=false
            - --seeds kafka:33145
            - --set redpanda.auto_create_topics_enabled=true
        environment:
            ALLOW_PLAINTEXT_LISTENER: 'true'
            KAFKA_LOG_RETENTION_MS: 3600000
            KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
            KAFKA_LOG_RETENTION_HOURS: 1
        healthcheck:
            test: curl -f http://localhost:9644/v1/status/ready || exit 1
            interval: 3s
            timeout: 10s
            retries: 10
        volumes:
            - kafka-data:/bitnami/kafka
            - redpanda-data:/var/lib/redpanda/data

    kafka-init:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        entrypoint: /bin/sh
        logging: *default-logging
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker..."
                TIMEOUT=60
                ELAPSED=0
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    sleep 2
                    ELAPSED=$$((ELAPSED + 2))
                    [ $$ELAPSED -ge $$TIMEOUT ] && exit 1
                done
                for topic in clickhouse_events_json; do
                    rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1 || \
                      rpk topic list --brokers kafka:9092 | grep -q "$$topic"
                done
                rpk topic list --brokers kafka:9092
        depends_on:
            kafka:
                condition: service_healthy

    objectstorage:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        restart: on-failure
        logging: *default-logging
        environment:
            MINIO_ROOT_USER: object_storage_root_user
            MINIO_ROOT_PASSWORD: object_storage_root_password
        entrypoint: sh
        command: -c 'mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address ":19000" --console-address ":19001" /data'
        volumes:
            - objectstorage:/data
        ports:
            - '19000:19000'
            - '19001:19001'

    seaweedfs:
        image: chrislusf/seaweedfs:4.03
        container_name: '${SEAWEEDFS_DOCKER_NAME:-seaweedfs-main}'
        restart: on-failure
        logging: *default-logging
        entrypoint:
            - /bin/sh
            - -c
            - |
                /usr/bin/weed "$$@" &
                WEED_PID=$$!
                while true; do
                    sleep 5
                    if echo "s3.bucket.list" | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q "posthog"; then
                        break
                    fi
                    echo "s3.bucket.create -name posthog" | /usr/bin/weed shell -master=localhost:9333 2>&1 || true
                done
                wait $$WEED_PID
            - --
        command: ['server', '-s3', '-s3.port=8333', '-dir=/data']
        ports:
            - '127.0.0.1:8333:8333'
            - '127.0.0.1:9333:9333'
        volumes:
            - seaweedfs:/data
        healthcheck:
            test: ['CMD', 'sh', '-c', "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog"]
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 10s

    proxy:
        image: caddy
        restart: always
        logging: *default-logging
        entrypoint: sh
        command: -c 'set -x && echo "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run -c /etc/caddy/Caddyfile'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        environment:
            CADDYFILE: |
                {
                    ${TLS_BLOCK:-auto_https off}
                }
                ${DOMAIN}, http://, https:// {
                    @replay-capture path /s /s/ /s/*
                    @capture path /e /e/ /e/* /i/v0 /i/v0/ /i/v0/* /batch /batch/ /batch/* /capture /capture/ /capture/*
                    @capture-logs path /i/v1/logs /i/v1/logs/ /i/v1/logs/* /i/v1/traces /i/v1/traces/ /i/v1/traces/*
                    @flags path /flags /flags/ /flags/*
                    @surveys path /surveys /surveys/ /api/surveys /api/surveys/
                    @remote-config path /array/*
                    @webhooks path /public/webhooks /public/webhooks/ /public/webhooks/* /public/m/ /public/m/*
                    @livestream path /livestream /livestream/ /livestream/*
                    @objectstorage path /posthog /posthog/ /posthog/*
                    handle @livestream {
                        uri strip_prefix /livestream
                        reverse_proxy livestream:8080 {
                            flush_interval -1
                        }
                    }
                    handle @capture {
                        reverse_proxy capture:3000
                    }
                    handle @replay-capture {
                        reverse_proxy replay-capture:3000
                    }
                    handle @flags {
                        reverse_proxy feature-flags:3001
                    }
                    handle @surveys {
                        reverse_proxy hypercache-server:3002
                    }
                    handle @remote-config {
                        reverse_proxy hypercache-server:3002
                    }
                    handle @webhooks {
                        reverse_proxy plugins:6738
                    }
                    handle @objectstorage {
                        reverse_proxy objectstorage:19000
                    }
                    handle {
                        reverse_proxy web:8000
                    }
                }
        depends_on:
            - web
            - livestream

    # ============================================================
    # PostHog 主应用 (Python / Django)
    # ============================================================

    web:
        image: posthog/posthog:16db3d19d9b1025a227c9d6c8a947d7053a95637
        command: sh -c "./bin/migrate && ./bin/docker-server"
        restart: on-failure
        logging: *default-logging
        env_file: services.env
        environment:
            DEPLOYMENT: 'hobby'
            SITE_URL: https://${DOMAIN}
            LIVESTREAM_HOST: 'https://${DOMAIN}/livestream'
            SECRET_KEY: ${POSTHOG_SECRET}
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://${DOMAIN}
            OBJECT_STORAGE_ENABLED: 'true'
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            RECORDING_API_URL: http://recording-api:6738
            OTEL_SERVICE_NAME: 'posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            OTEL_SDK_DISABLED: 'true'
            OPT_OUT_CAPTURE: ${OPT_OUT_CAPTURE:-false}
            PERSONHOG_ADDR: 'http://personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ROLLOUT_PERCENTAGE: '100'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            kafka:
                condition: service_healthy
            seaweedfs:
                condition: service_healthy
            objectstorage:
                condition: service_started
            personhog-router:
                condition: service_started

    worker:
        image: posthog/posthog:16db3d19d9b1025a227c9d6c8a947d7053a95637
        command: ./bin/docker-worker-celery --with-scheduler
        restart: on-failure
        logging: *default-logging
        env_file: services.env
        environment:
            DEPLOYMENT: 'hobby'
            SITE_URL: https://${DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET}
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://${DOMAIN}
            OBJECT_STORAGE_ENABLED: 'true'
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            RECORDING_API_URL: http://recording-api:6738
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
            OTEL_SDK_DISABLED: 'true'
            API_QUERIES_PER_TEAM: '{"1": 100}'
            CDP_API_URL: 'http://plugins:6738'
            FLAGS_REDIS_ENABLED: 'false'
            PERSONHOG_ADDR: 'http://personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ROLLOUT_PERCENTAGE: '100'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            web:
                condition: service_started
            personhog-router:
                condition: service_started

    asyncmigrationscheck:
        image: posthog/posthog:16db3d19d9b1025a227c9d6c8a947d7053a95637
        command: python manage.py run_async_migrations --check
        restart: 'no'
        logging: *default-logging
        env_file: services.env
        deploy:
            replicas: 0
        environment:
            DEPLOYMENT: 'hobby'
            SITE_URL: https://${DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET}
            SKIP_ASYNC_MIGRATIONS_SETUP: '0'

    temporal-django-worker:
        image: posthog/posthog:16db3d19d9b1025a227c9d6c8a947d7053a95637
        command: ./bin/temporal-django-worker
        restart: on-failure
        logging: *default-logging
        env_file: services.env
        environment:
            DEPLOYMENT: 'hobby'
            TEMPORAL_HOST: temporal
            SITE_URL: https://${DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET}
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal

    # ============================================================
    # PostHog Node 服务 (plugins / ingestion / recording)
    # ============================================================

    plugins:
        image: posthog/posthog-node@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            SITE_URL: https://${DOMAIN}
            SECRET_KEY: ${POSTHOG_SECRET}
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            CYCLOTRON_DATABASE_URL: 'postgres://posthog:posthog@db:5432/cyclotron'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: '6379'
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://${DOMAIN}
            OBJECT_STORAGE_ENABLED: 'true'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
        volumes:
            - ./share:/share:ro
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs

    ingestion-general:
        image: posthog/posthog-node@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-v2-combined'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            COOKIELESS_REDIS_HOST: redis7
            COOKIELESS_REDIS_PORT: '6379'
            CDP_REDIS_HOST: redis7
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka

    ingestion-sessionreplay:
        image: posthog/posthog-node@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'recordings-blob-ingestion-v2'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: '120000'
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
        depends_on:
            - db
            - redis7
            - kafka
            - seaweedfs

    recording-api:
        image: posthog/posthog-node@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'recording-api'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            REDIS_URL: 'redis://redis7:6379/'
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            SESSION_RECORDING_API_REDIS_HOST: redis7
            SESSION_RECORDING_API_REDIS_PORT: '6379'
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
        depends_on:
            - db
            - redis7
            - clickhouse

    ingestion-error-tracking:
        image: posthog/posthog-node@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-errortracking'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CDP_REDIS_HOST: redis7
            ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS}
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-logs:
        image: posthog/posthog-node@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-logs'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            LOGS_REDIS_HOST: redis7
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-traces:
        image: posthog/posthog-node@sha256:863e76e040ad41aef79f605c33ec71f1529bddf94cfd88941c935da9bde97235
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-traces'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            TRACES_REDIS_HOST: redis7
        depends_on:
            - db
            - redis7
            - kafka

    # ============================================================
    # Rust 服务 (capture / feature-flags / personhog 等)
    # ============================================================

    capture:
        image: ghcr.io/posthog/posthog/capture:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        environment:
            ADDRESS: '0.0.0.0:3000'
            KAFKA_TOPIC: 'events_plugin_ingestion'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CAPTURE_MODE: events
            RUST_LOG: 'info,rdkafka=warn'

    replay-capture:
        image: ghcr.io/posthog/posthog/capture:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        environment:
            ADDRESS: '0.0.0.0:3000'
            KAFKA_TOPIC: 'session_recording_snapshot_item_events'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CAPTURE_MODE: recordings

    property-defs-rs:
        image: ghcr.io/posthog/posthog/property-defs-rs:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        environment:
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            SKIP_WRITES: 'false'
            SKIP_READS: 'false'
            FILTER_MODE: 'opt-out'
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy

    feature-flags:
        image: ghcr.io/posthog/posthog/feature-flags:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3001/_readiness']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        volumes:
            - ./share:/share:ro
        environment:
            WRITE_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            READ_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_WRITE_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_READ_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ADDRESS: '0.0.0.0:3001'
            RUST_LOG: 'info'
            COOKIELESS_REDIS_HOST: redis7
            COOKIELESS_REDIS_PORT: '6379'
        depends_on:
            - db
            - redis7

    personhog-replica:
        image: ghcr.io/posthog/posthog/personhog-replica:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: '0.0.0.0:50051'
            PRIMARY_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            RUST_LOG: 'info'
            METRICS_PORT: '9100'
        depends_on:
            db:
                condition: service_healthy

    personhog-router:
        image: ghcr.io/posthog/posthog/personhog-router:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: '0.0.0.0:50052'
            REPLICA_URL: 'http://personhog-replica:50051'
            BACKEND_TIMEOUT_MS: '5000'
            RUST_LOG: 'info'
            METRICS_PORT: '9101'
        depends_on:
            - personhog-replica

    hypercache-server:
        image: ghcr.io/posthog/posthog/hypercache-server:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3002/_readiness']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        environment:
            REDIS_URL: 'redis://redis7:6379/'
            ADDRESS: '0.0.0.0:3002'
            RUST_LOG: 'info'
        depends_on:
            - redis7

    cyclotron-janitor:
        image: ghcr.io/posthog/posthog/cyclotron-janitor:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        environment:
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/cyclotron'
            KAFKA_HOSTS: 'kafka:9092'
            KAFKA_TOPIC: 'clickhouse_app_metrics2'
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started

    livestream:
        image: ghcr.io/posthog/posthog/livestream:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
        volumes:
            - ./config/livestream/configs-hobby.yml:/configs/configs.yml:ro
        depends_on:
            kafka:
                condition: service_started

    cymbal:
        image: ghcr.io/posthog/posthog/cymbal:sha-d8b12b0
        restart: on-failure
        logging: *default-logging
        volumes:
            - ./share:/share:ro
        environment:
            KAFKA_HOSTS: 'kafka:9092'
            OBJECT_STORAGE_BUCKET: posthog
            OBJECT_STORAGE_ACCESS_KEY_ID: 'any'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: 'http://seaweedfs:8333'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            BIND_HOST: '0.0.0.0'
            BIND_PORT: '3302'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_URL: 'postgres://posthog:posthog@db:5432/posthog'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ISSUE_BUCKETS_REDIS_URL: 'redis://redis7:6379/'
            RUST_LOG: 'info'
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            seaweedfs:
                condition: service_healthy
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy

    # ============================================================
    # Temporal (工作流引擎)
    # ============================================================

    elasticsearch:
        image: elasticsearch:7.17.28
        logging: *default-logging
        environment:
            - cluster.routing.allocation.disk.threshold_enabled=true
            - cluster.routing.allocation.disk.watermark.low=512mb
            - cluster.routing.allocation.disk.watermark.high=256mb
            - cluster.routing.allocation.disk.watermark.flood_stage=128mb
            - discovery.type=single-node
            - ES_JAVA_OPTS=-Xms256m -Xmx256m
            - xpack.security.enabled=false
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -s http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""',
                ]
            interval: 10s
            timeout: 10s
            retries: 30
            start_period: 60s
        expose:
            - 9200
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data

    temporal:
        image: temporalio/auto-setup:1.26.2
        restart: on-failure
        logging: *default-logging
        ports:
            - 7233:7233
        environment:
            - DB=postgres12
            - DB_PORT=5432
            - POSTGRES_USER=posthog
            - POSTGRES_PWD=posthog
            - POSTGRES_SEEDS=db
            - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
            - ENABLE_ES=false
        healthcheck:
            test: ['CMD-SHELL', 'nc -z $(hostname) 7233']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 300s
        volumes:
            - ./config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
        depends_on:
            db:
                condition: service_healthy

    temporal-admin-tools:
        image: temporalio/admin-tools:1.26.2
        logging: *default-logging
        environment:
            - TEMPORAL_CLI_ADDRESS=temporal:7233
        stdin_open: true
        tty: true
        depends_on:
            - temporal

    temporal-ui:
        image: temporalio/ui:2.47.2
        logging: *default-logging
        ports:
            - 8081:8080
        environment:
            - TEMPORAL_ADDRESS=temporal:7233
            - TEMPORAL_CORS_ORIGINS=http://localhost:3000
            - TEMPORAL_CSRF_COOKIE_INSECURE=true
            - TEMPORAL_CODEC_ENDPOINT=http://localhost:8000
        depends_on:
            temporal:
                condition: service_started
            db:
                condition: service_healthy

# 数据卷 → 主机路径 ${DATA_ROOT:-./data}/<volume-name>
# 首次启动前请确保各子目录存在: bash scripts/init-volumes.sh 或参考 README "数据卷"
volumes:
    postgres-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/postgres-data" }
    redis7-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/redis7-data" }
    clickhouse-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/clickhouse-data" }
    zookeeper-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/zookeeper-data" }
    zookeeper-datalog:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/zookeeper-datalog" }
    zookeeper-logs:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/zookeeper-logs" }
    kafka-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/kafka-data" }
    redpanda-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/redpanda-data" }
    objectstorage:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/objectstorage" }
    seaweedfs:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/seaweedfs" }
    caddy-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/caddy-data" }
    caddy-config:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/caddy-config" }
    elasticsearch-data:
        driver: local
        driver_opts: { type: none, o: bind, device: "${DATA_ROOT:-./data}/elasticsearch-data" }
